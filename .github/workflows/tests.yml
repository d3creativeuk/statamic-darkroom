name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # composer.lock isn't committed, so each PHP version resolves the
        # newest Statamic it supports. 8.3 is the floor: Statamic 6 pulls
        # Laravel 12.40+/13, which requires PHP ^8.3.
        php: ['8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Run tests
        run: vendor/bin/phpunit
